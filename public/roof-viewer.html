<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>belinus — roof layout</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --cyan: #05ade5; --black: #0b0d0f; }
  html, body { margin: 0; height: 100%; background: var(--black); color: #fff; font-family: Inter, system-ui, sans-serif; overflow: hidden; }
  #stage { position: absolute; inset: 0; cursor: grab; touch-action: none; }
  #stage.drag { cursor: grabbing; }
  svg { width: 100%; height: 100%; display: block; }
  .panel { fill: rgba(11, 22, 40, .88); stroke: #46B2E9; stroke-width: .35; }
  .panel.s1 { fill: rgba(16, 36, 64, .88); }
  .panel.s2 { fill: rgba(22, 48, 86, .88); }
  .panel:hover { fill: rgba(5, 173, 229, .75); }
  .hud { position: absolute; left: 14px; bottom: 14px; background: rgba(11, 13, 15, .82); border-left: 2px solid var(--cyan);
         padding: 10px 14px; font-size: 13px; line-height: 1.5; max-width: 70%; }
  .hud b { font-family: "JetBrains Mono", monospace; color: var(--cyan); font-weight: 700; }
  .hud .src { color: #8c9499; font-size: 11px; margin-top: 4px; }
  .ctl { position: absolute; right: 14px; top: 14px; display: flex; flex-direction: column; gap: 6px; }
  .ctl button { width: 34px; height: 34px; border: 1px solid #2a2f33; background: rgba(11, 13, 15, .82); color: #fff;
                font: 700 18px Inter, sans-serif; cursor: pointer; }
  .ctl button:hover { border-color: var(--cyan); color: var(--cyan); }
  .north { position: absolute; right: 14px; bottom: 14px; width: 34px; height: 34px; }
  .hidden { display: none; }
  .msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #8c9499; font-size: 14px; }
  @media (max-width: 600px) { .hud { font-size: 12px; max-width: 78%; } }
</style>
</head>
<body>
<div id="stage"><div class="msg" id="msg">…</div></div>
<div class="ctl"><button id="zin" aria-label="zoom in">+</button><button id="zout" aria-label="zoom out">−</button><button id="zreset" aria-label="reset">⟲</button></div>
<svg class="north" viewBox="0 0 34 34" aria-label="North"><circle cx="17" cy="17" r="16" fill="rgba(11,13,15,.82)" stroke="#2a2f33"/><path d="M17 5 L22 20 L17 17 L12 20 Z" fill="#05ade5"/><text x="17" y="30" text-anchor="middle" font-size="8" font-family="Inter" fill="#fff">N</text></svg>
<div class="hud hidden" id="hud"></div>
<script>
const qs = new URLSearchParams(location.search);
const API = location.origin + "/api";
const id = qs.get("design_id");
const lang = () => { try { return parent.document.documentElement.lang === "nl" ? "nl" : "en"; } catch { return "nl"; } };
const L = {
  nl: { panels: "panelen", yr: "kWh/jaar", img: "Luchtbeeld", src: "Dakanalyse Google Solar API · opbrengst PVGIS (EU JRC)", none: "Geen ontwerp beschikbaar", seg: "dakvlak" },
  en: { panels: "panels", yr: "kWh/year", img: "Imagery", src: "Roof analysis Google Solar API · yield PVGIS (EU JRC)", none: "No design available", seg: "roof face" },
};
const nf = (n) => Math.round(n).toLocaleString("nl-BE");

// Web Mercator → pixel in the 640×640 logical static-map tile
function project(lat, lng, c, z) {
  const s = 256 * Math.pow(2, z);
  const x = (l) => ((l + 180) / 360) * s;
  const y = (la) => { const r = Math.sin((la * Math.PI) / 180); return (0.5 - Math.log((1 + r) / (1 - r)) / (4 * Math.PI)) * s; };
  return [320 + x(lng) - x(c.lng), 320 + y(lat) - y(c.lat)];
}

let D = null;
function hud() {
  if (!D) return;
  const T = L[lang()];
  const date = D.imagery_date ? `${T.img}: ${D.imagery_date}${D.imagery_quality ? " · " + D.imagery_quality : ""}` : "";
  const prod = D.production ? ` · <b>${nf(D.production.annual_kwh)}</b> ${T.yr}` : "";
  document.getElementById("hud").innerHTML =
    `<div><b>${D.panel_count}</b> ${T.panels} · <b>${D.kwp.toFixed(2).replace(".", ",")}</b> kWp${prod}</div>` +
    `<div class="src">${date ? date + "<br>" : ""}${T.src}</div>`;
  document.getElementById("hud").classList.remove("hidden");
}

// pan / zoom via the SVG viewBox
let vb = { x: 0, y: 0, w: 640, h: 640 };
let svgEl = null;
const setVb = () => svgEl && svgEl.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
function zoomAt(f, cx = vb.x + vb.w / 2, cy = vb.y + vb.h / 2) {
  const nw = Math.min(640, Math.max(90, vb.w / f));
  const k = nw / vb.w;
  vb = { x: cx - (cx - vb.x) * k, y: cy - (cy - vb.y) * k, w: nw, h: nw };
  setVb();
}
function initialFrame() {
  // Frame the panels (plus margin) so the design is the first thing you see.
  const pts = D.panels.flatMap((p) => p.poly.map(([la, ln]) => project(la, ln, D.center, D.zoom)));
  if (!pts.length) { vb = { x: 0, y: 0, w: 640, h: 640 }; return setVb(); }
  const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
  const cx = (Math.min(...xs) + Math.max(...xs)) / 2, cy = (Math.min(...ys) + Math.max(...ys)) / 2;
  const span = Math.min(640, Math.max(160, (Math.max(...xs) - Math.min(...xs)) * 2.2, (Math.max(...ys) - Math.min(...ys)) * 2.2));
  vb = { x: cx - span / 2, y: cy - span / 2, w: span, h: span };
  setVb();
}

// small pin on the geocoded address, so the customer recognises the house
function pin() {
  if (!D.address_point) return "";
  const [x, y] = project(D.address_point[0], D.address_point[1], D.center, D.zoom);
  return `<g transform="translate(${x.toFixed(1)},${y.toFixed(1)})"><path d="M0 0 C-3 -5 -5 -7 -5 -10 A5 5 0 1 1 5 -10 C5 -7 3 -5 0 0Z" fill="#05ade5" stroke="#fff" stroke-width="1"/><circle cx="0" cy="-10" r="1.8" fill="#fff"/></g>`;
}

async function load() {
  const stage = document.getElementById("stage");
  if (!id) { document.getElementById("msg").textContent = L[lang()].none; return; }
  try {
    const r = await fetch(`${API}/design?design_id=${encodeURIComponent(id)}`);
    if (!r.ok) throw new Error(r.status);
    D = await r.json();
  } catch { document.getElementById("msg").textContent = L[lang()].none; return; }

  const segIdx = [...new Set(D.panels.map((p) => p.segment_index))];
  const polys = D.panels.map((p) => {
    const pts = p.poly.map(([la, ln]) => project(la, ln, D.center, D.zoom).map((v) => v.toFixed(2)).join(",")).join(" ");
    const cls = "panel s" + (segIdx.indexOf(p.segment_index) % 3);
    return `<polygon class="${cls}" points="${pts}"><title>${nf(p.kwh)} kWh DC</title></polygon>`;
  }).join("");
  stage.innerHTML =
    `<svg id="svg" viewBox="0 0 640 640" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">` +
    `<image href="${API}/roof-image?design_id=${encodeURIComponent(id)}" x="0" y="0" width="640" height="640"/>` +
    `<g>${polys}</g>${pin()}</svg>`;
  svgEl = document.getElementById("svg");
  initialFrame();
  hud();

  // wheel zoom + drag pan
  stage.addEventListener("wheel", (e) => {
    e.preventDefault();
    const pt = svgEl.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const p = pt.matrixTransform(svgEl.getScreenCTM().inverse());
    zoomAt(e.deltaY < 0 ? 1.2 : 1 / 1.2, p.x, p.y);
  }, { passive: false });
  let drag = null;
  stage.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY, vb: { ...vb } }; stage.classList.add("drag"); stage.setPointerCapture(e.pointerId); });
  stage.addEventListener("pointermove", (e) => {
    if (!drag) return;
    const k = vb.w / Math.max(stage.clientWidth, stage.clientHeight); // slice scaling
    vb.x = drag.vb.x - (e.clientX - drag.x) * k; vb.y = drag.vb.y - (e.clientY - drag.y) * k; setVb();
  });
  const end = () => { drag = null; stage.classList.remove("drag"); };
  stage.addEventListener("pointerup", end); stage.addEventListener("pointercancel", end);
}
document.getElementById("zin").onclick = () => zoomAt(1.4);
document.getElementById("zout").onclick = () => zoomAt(1 / 1.4);
document.getElementById("zreset").onclick = () => D && initialFrame();
// follow the language toggle of the parent page
let lastLang = lang(); setInterval(() => { if (lang() !== lastLang) { lastLang = lang(); hud(); } }, 800);
load();
</script>
</body>
</html>
