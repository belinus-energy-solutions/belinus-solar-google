name: build-and-push

# Builds the container and pushes it to GHCR on every push to main.
# Bunny Magic Container pulls ghcr.io/belinus-energy-solutions/belinus-solar-google:latest.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The customer page, datasheets, terms and logo come from the Aurora version
      # (belinus-solar-test) at a pinned commit, so both links show the same page.
      # Bump UI_REF to pick up UI changes made in belinus-solar-test.
      - name: Build frontend from belinus-solar-test
        env:
          UI_REF: cc838b617e0d4ed56f8f7a4dbbecb88ba1e0d314
        run: |
          git clone https://github.com/belinus-energy-solutions/belinus-solar-test /tmp/ui
          git -C /tmp/ui checkout "$UI_REF"
          python3 scripts/build_frontend.py /tmp/ui public/index.html
          mkdir -p public/datasheets
          cp /tmp/ui/datasheets/*.pdf public/datasheets/
          cp /tmp/ui/cowboy-voorwaarden.html /tmp/ui/belinus-logo.png public/

      - name: Type-check and test
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check server.ts && deno test --allow-env test/

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/belinus-energy-solutions/belinus-solar-google:latest
            ghcr.io/belinus-energy-solutions/belinus-solar-google:${{ github.sha }}
